<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Pruebas, depuración, monitoreo y validación de MyCoins</title>
  <desc id="desc">Infografía técnica con caso real: registrar un gasto desde MyCoins móvil hacia la API.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#d9ded5" stroke-width="1"/></pattern>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}
      .ink{fill:#172b27}.muted{fill:#596760}.white{fill:#fffdf7}.mint{fill:#b9edcf}.coral{fill:#ed7457}.blue{fill:#255b78}
      .label{font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:700;letter-spacing:1.5px}
      .body{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#263b35}
      .caseBody{font-size:21px}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#596760}
      .small.white{fill:#fffdf7}
      .panel{fill:#fffdf7;stroke:#d8ded5;stroke-width:2}
      .line{stroke:#d8ded5;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="1800" fill="#f0efe5"/>
  <rect width="1200" height="1800" fill="url(#grid)" opacity=".48"/>
  <rect width="1200" height="278" fill="#173b35"/>
  <path d="M930 0h270v278H830z" fill="#255b78" opacity=".72"/>
  <circle cx="1080" cy="72" r="120" fill="#ed7457" opacity=".9"/>
  <circle cx="1150" cy="194" r="68" fill="#e8bb50"/>
  <text x="64" y="58" class="label mint">GUÍA DE CALIDAD · APLICACIÓN CONECTADA</text>
  <text x="64" y="126" class="serif white" font-size="56" font-weight="700">¿Funciona de verdad?</text>
  <text x="64" y="177" class="sans white" font-size="25">Pruebas, depuración, monitoreo y validación</text>
  <rect x="64" y="211" width="260" height="38" rx="19" fill="#b9edcf"/>
  <text x="82" y="237" class="label ink" font-size="15">CASO REAL · MYCOINS</text>
  <text x="64" y="317" class="label blue">01 / CASO PRÁCTICO CONECTADO</text>
  <rect x="48" y="338" width="1104" height="270" rx="18" fill="#fffdf7" stroke="#d8ded5" stroke-width="2"/>
  <rect x="48" y="338" width="14" height="270" rx="7" fill="#ed7457"/>
  <text x="84" y="385" class="serif ink" font-size="34" font-weight="700">Registrar un gasto desde la app móvil</text>
  <text x="84" y="425" class="body caseBody"><tspan font-weight="700">Acción:</tspan> enviar un movimiento autenticado a la API propia.</text>
  <text x="84" y="463" class="body caseBody"><tspan font-weight="700">Escenario válido:</tspan> Transporte · 8,50 USD · “Pasaje de bus”.</text>
  <text x="84" y="501" class="body caseBody"><tspan font-weight="700">Solicitud:</tspan> POST /api/finanzas/transactions · token Bearer</text>
  <text x="84" y="539" class="body caseBody"><tspan font-weight="700">Resultado esperado:</tspan> HTTP 201, un movimiento nuevo y resumen actualizado.</text>
  <rect x="84" y="558" width="1068" height="34" rx="8" fill="#e8f4e9"/>
  <text x="100" y="581" class="small" font-weight="700">EVIDENCIA: captura del gasto y resumen actualizado + Network con 201; ocultar el token.</text>

  <text x="64" y="654" class="label blue">02 / COMPRUEBA, OBSERVA Y VALIDA</text>
  <rect x="48" y="676" width="536" height="260" rx="16" class="panel"/>
  <rect x="48" y="676" width="536" height="10" rx="5" fill="#e8bb50"/>
  <text x="76" y="725" class="serif ink" font-size="30" font-weight="700">Pruebas</text>
  <text x="76" y="764" class="body">01  Funcionalidad: aparece el gasto y cambia el balance.</text>
  <text x="76" y="798" class="body">02  Conexión: API activa responde; revisar HTTP y latencia.</text>
  <text x="76" y="832" class="body">03  Datos: monto 8,50 pasa; monto 0 debe rechazarse.</text>
  <text x="76" y="866" class="body">04  Sin conexión: apagar red; mostrar error, no duplicar.</text>
  <text x="76" y="906" class="small">Tras reconectar: repetir una vez y verificar un solo registro.</text>

  <rect x="616" y="676" width="536" height="260" rx="16" class="panel"/>
  <rect x="616" y="676" width="536" height="10" rx="5" fill="#ed7457"/>
  <text x="644" y="725" class="serif ink" font-size="30" font-weight="700">Validación · cliente / servidor</text>
  <text x="644" y="764" class="body"><tspan font-weight="700">Cliente:</tspan> completar cuenta, categoría, monto y descripción.</text>
  <text x="644" y="798" class="body"><tspan font-weight="700">Servidor (Zod):</tspan> UUID, tipo y monto positivo finito.</text>
  <text x="644" y="832" class="body">Moneda 3 letras · descripción 1–240 · fecha válida.</text>
  <text x="644" y="866" class="body">Rango: monto &gt; 0; formato y fecha válidos.</text>
  <text x="644" y="906" class="small">Duplicados: reintento/doble toque; comprobar que solo haya uno.</text>

  <rect x="48" y="956" width="536" height="270" rx="16" class="panel"/>
  <rect x="48" y="956" width="536" height="10" rx="5" fill="#255b78"/>
  <text x="76" y="1005" class="serif ink" font-size="30" font-weight="700">Depuración</text>
  <text x="76" y="1044" class="body">Propósito: encontrar en qué salto se rompe la solicitud.</text>
  <text x="76" y="1078" class="body">Herramientas: consola/Network del navegador o Logcat.</text>
  <text x="76" y="1112" class="body">Backend: terminal de Next.js; revisar ruta, estado y error.</text>
  <text x="76" y="1146" class="body">Ejemplo: “Failed to fetch” → API apagada o URL inaccesible.</text>
  <text x="76" y="1180" class="small">Causa probable: host incorrecto, servidor detenido o sin red.</text>
  <text x="76" y="1210" class="small" font-weight="700">Nunca registrar contraseñas ni tokens.</text>

  <rect x="616" y="956" width="536" height="270" rx="16" class="panel"/>
  <rect x="616" y="956" width="536" height="10" rx="5" fill="#4c8c68"/>
  <text x="644" y="1005" class="serif ink" font-size="30" font-weight="700">Monitoreo</text>
  <text x="644" y="1044" class="body">API: disponibilidad y latencia de cada respuesta.</text>
  <text x="644" y="1078" class="body">Red: errores de conexión, timeout y códigos HTTP.</text>
  <text x="644" y="1112" class="body">Datos: verificar registro, propietario y consulta del resumen.</text>
  <text x="644" y="1146" class="body">Logs: ruta, hora, estado y duración; buscar 4xx/5xx.</text>
  <text x="644" y="1180" class="small">201 esperado · 400 datos inválidos · 401 sesión inválida ·</text>
  <text x="644" y="1208" class="small">sin HTTP: falla de red/API. No exponer datos sensibles.</text>

  <rect x="48" y="1246" width="1104" height="188" rx="18" fill="#173b35"/>
  <text x="76" y="1290" class="label mint">03 / CICLO DE DIAGNÓSTICO</text>
  <text x="76" y="1324" class="small white">Del síntoma a una comprobación repetible:</text>
  <g class="sans" text-anchor="middle">
    <g transform="translate(124 1370)"><circle r="24" fill="#e8bb50"/><text y="7" class="ink" font-size="19" font-weight="700">1</text><text y="52" class="white" font-size="17">Ejecutar</text></g>
    <path d="M163 1370h28" stroke="#b9edcf" stroke-width="3"/>
    <g transform="translate(265 1370)"><circle r="24" fill="#ed7457"/><text y="7" class="white" font-size="19" font-weight="700">2</text><text y="52" class="white" font-size="17">Detectar</text></g>
    <path d="M304 1370h28" stroke="#b9edcf" stroke-width="3"/>
    <g transform="translate(406 1370)"><circle r="24" fill="#255b78"/><text y="7" class="white" font-size="19" font-weight="700">3</text><text y="52" class="white" font-size="17">Ver logs</text></g>
    <path d="M445 1370h28" stroke="#b9edcf" stroke-width="3"/>
    <g transform="translate(547 1370)"><circle r="24" fill="#e8bb50"/><text y="7" class="ink" font-size="19" font-weight="700">4</text><text y="52" class="white" font-size="17">Causa</text></g>
    <path d="M586 1370h28" stroke="#b9edcf" stroke-width="3"/>
    <g transform="translate(688 1370)"><circle r="24" fill="#ed7457"/><text y="7" class="white" font-size="19" font-weight="700">5</text><text y="52" class="white" font-size="17">Corregir</text></g>
    <path d="M727 1370h28" stroke="#b9edcf" stroke-width="3"/>
    <g transform="translate(829 1370)"><circle r="24" fill="#255b78"/><text y="7" class="white" font-size="19" font-weight="700">6</text><text y="52" class="white" font-size="17">Repetir</text></g>
    <path d="M868 1370h28" stroke="#b9edcf" stroke-width="3"/>
    <g transform="translate(970 1370)"><circle r="24" fill="#4c8c68"/><text y="7" class="white" font-size="19" font-weight="700">7</text><text y="52" class="white" font-size="17">Validar</text></g>
  </g>

  <text x="64" y="1481" class="label blue">04 / EQUIPO · COMPLETAR ANTES DE ENTREGAR</text>
  <rect x="48" y="1502" width="1104" height="176" rx="16" class="panel"/>
  <text x="76" y="1544" class="body"><tspan font-weight="700">1. Coordinación:</tspan> nombre y apellido __________________________</text>
  <text x="76" y="1580" class="body"><tspan font-weight="700">2. Pruebas y validación:</tspan> nombre y apellido ____________________</text>
  <text x="76" y="1616" class="body"><tspan font-weight="700">3. Depuración y monitoreo:</tspan> nombre y apellido __________________</text>
  <text x="76" y="1652" class="body"><tspan font-weight="700">4. Diseño y entrega (si son 4):</tspan> nombre y apellido ______________</text>
  <rect x="48" y="1686" width="1104" height="102" rx="14" fill="#e8bb50"/>
  <text x="72" y="1718" class="label ink" font-size="15">ORAL: ¿CÓMO DISTINGUES UN HTTP 400 DE UN FALLO DE RED SIN RESPUESTA?</text>
  <text x="72" y="1748" class="sans ink" font-size="17">Cámara encendida · 3 min inicio · 17 creación · 7 socialización · 3 entrega</text>
  <text x="64" y="1775" class="small" font-size="15">MyCoins Ionic · Backend Next.js · API PostgreSQL</text>
</svg>
